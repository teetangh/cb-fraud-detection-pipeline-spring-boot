spring:
  application:
    name: scoring-service


  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      group-id: ${KAFKA_GROUP:fraud-scoring-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # NEVER auto-commit (§9.6). Auto-commit fires on a wall-clock timer,
      # decoupled from whether the work succeeded — a crash between the commit
      # and the downstream publish loses the message SILENTLY rather than
      # redelivering it.
      enable-auto-commit: false
      properties:
        # Explicit, on every consumer group (§9.5). With the default eager
        # assignor ANY rebalance revokes ALL partitions from ALL members — the
        # whole group stops, including partitions nobody was going to move.
        # ALL members must agree: a mixed group falls back to eager, so one
        # misconfigured instance degrades the entire group.
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: ${KAFKA_CONCURRENCY:3}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 4000
        request.timeout.ms: 2000

couchbase:
  connection-string: ${CB_CONNECTION:couchbase://localhost}
  username: ${CB_USER:Administrator}
  password: ${CB_PASSWORD:password}
  bucket: ${CB_BUCKET:fraud-detection}

fraud:
  topics:
    enriched: fraud.transactions.enriched
    scored: fraud.transactions.scored

rules:
  # A fraud analyst edits the document in Couchbase and the change is live within
  # a minute, with no restart and no deploy (spec §1). POST /admin/rules/refresh
  # forces it immediately — needed for operational urgency, and so T8 can assert
  # hot reload without a 60-second sleep.
  refresh-interval-ms: 60000

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Spring Boot does NOT add custom HealthIndicator beans to the readiness
      # group by default (only readinessState is included) — confirmed against
      # the Boot 4.1 actuator reference. Without this, ScoringReadinessIndicator
      # (bean name "ruleset") is never consulted by
      # /actuator/health/readiness, the docker-compose healthcheck reports UP
      # the moment the context starts, and the whole point of gating traffic on
      # "a ruleset has loaded at least once" silently does nothing.
      group:
        readiness:
          include: readinessState,ruleset
  metrics:
    tags:
      service: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
  level:
    com.fraud.scoring: INFO
    com.couchbase.client: WARN
