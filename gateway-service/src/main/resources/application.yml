spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short: Redis is not the authority for anything on this path, so a hung
      # Redis must cost milliseconds rather than the caller's 150ms budget.
      timeout: 200ms
      connect-timeout: 200ms

fraud:
  jwt:
    # Shared secret — spec §13's accepted simplification. Note the weakness:
    # with a symmetric secret every verifier can also mint. Issue #6.
    # REQUIRED, no fallback (issue #20). A checked-in default secret is a
    # publicly-known signing key: a gateway deployed without JWT_SECRET set would
    # happily accept tokens forged by anyone who has read this repository.
    secret: ${JWT_SECRET}
  ingestion:
    base-url: ${INGESTION_URL:http://localhost:8082}
    # Comfortably above ingestion's own work, but well under any caller patience.
    timeout-ms: 2000
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:100}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
  level:
    com.fraud.gateway: INFO
